<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Ice - MAS Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a1520;
            --bg-card: rgba(200, 230, 255, 0.08);
            --border-color: rgba(200, 230, 255, 0.2);
            --text-primary: #e8f4ff;
            --text-secondary: rgba(232, 244, 255, 0.6);
            --ice-light: #c8e6ff;
            --ice-blue: #88ccff;
            --ice-deep: #4488cc;
            --ice-white: #ffffff;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(180deg, #0a1520 0%, #102030 100%);
            color: var(--text-primary);
            overflow: hidden;
        }

        #canvas-container { width: 100vw; height: 100vh; }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(10, 21, 32, 0.95), transparent);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ice-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .title {
            font-size: 22px;
            font-weight: 200;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--ice-light);
            text-shadow: 0 0 20px rgba(136, 204, 255, 0.5);
        }

        .control-panel {
            position: fixed;
            top: 80px;
            left: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 24px;
            backdrop-filter: blur(20px);
            width: 280px;
        }

        .panel-section {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        .section-title {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
            color: var(--ice-blue);
        }

        .btn-group { display: flex; gap: 8px; }

        .btn {
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            border-radius: 2px;
            font-size: 12px;
            font-family: 'Raleway', sans-serif;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s;
            flex: 1;
        }

        .btn:hover { background: rgba(136, 204, 255, 0.1); }

        .btn.active {
            background: linear-gradient(135deg, rgba(136, 204, 255, 0.2), rgba(200, 230, 255, 0.2));
            border-color: var(--ice-blue);
            box-shadow: 0 0 20px rgba(136, 204, 255, 0.2), inset 0 0 20px rgba(200, 230, 255, 0.05);
        }

        .slider-row { margin-top: 14px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 10px; letter-spacing: 1px; }
        .slider-label span:first-child { color: var(--text-secondary); text-transform: uppercase; }
        .slider-label span:last-child { color: var(--ice-light); }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            height: 2px;
            background: var(--border-color);
            border-radius: 1px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--ice-light);
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(200, 230, 255, 0.5);
            transform: rotate(45deg);
        }

        .step-controls { display: flex; gap: 10px; margin-top: 14px; }

        .step-btn {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--ice-blue);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-btn:hover:not(:disabled) { background: rgba(136, 204, 255, 0.1); }
        .step-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .step-btn.primary { flex: 1; background: rgba(136, 204, 255, 0.1); }
        .step-btn svg { width: 18px; height: 18px; }

        .status-panel {
            position: fixed;
            top: 80px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 24px;
            backdrop-filter: blur(20px);
            width: 260px;
        }

        .status-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--ice-light);
            transform: rotate(45deg);
            box-shadow: 0 0 15px var(--ice-light);
            animation: ice-glow 3s ease-in-out infinite;
        }

        .status-dot.paused { animation: none; opacity: 0.5; }

        @keyframes ice-glow {
            0%, 100% { box-shadow: 0 0 15px var(--ice-light); }
            50% { box-shadow: 0 0 25px var(--ice-blue); }
        }

        .status-title { font-size: 12px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; color: var(--ice-light); }
        .status-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 12px; letter-spacing: 1px; }
        .status-label { color: var(--text-secondary); text-transform: uppercase; font-size: 10px; }
        .status-value { font-weight: 400; }
        .status-value.highlight { color: var(--ice-blue); }

        .progress-section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border-color); }
        .progress-bar { height: 2px; background: var(--border-color); margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--ice-deep), var(--ice-blue), var(--ice-light)); box-shadow: 0 0 10px var(--ice-blue); transition: width 0.5s ease; }

        .flow-path {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 18px 24px;
            backdrop-filter: blur(20px);
        }

        .path-title { font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--ice-blue); margin-bottom: 14px; }
        .path-nodes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .path-node {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid transparent;
            font-size: 11px;
            letter-spacing: 1px;
            opacity: 0.4;
            transition: all 0.4s;
        }

        .path-node.visited { opacity: 1; border-color: var(--ice-deep); }
        .path-node.active { opacity: 1; border-color: var(--ice-light); background: rgba(200, 230, 255, 0.05); box-shadow: 0 0 20px rgba(200, 230, 255, 0.1); }
        .path-arrow { color: var(--ice-blue); font-size: 14px; opacity: 0.3; }
        .path-arrow.active { opacity: 1; }
        .node-dot { width: 6px; height: 6px; transform: rotate(45deg); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="header">
        <a href="../index.html" class="back-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back</a>
        <div class="title">Crystal Ice</div>
        <div></div>
    </div>

    <div class="control-panel">
        <div class="panel-section">
            <div class="section-title">Flow Control</div>
            <div class="btn-group">
                <button class="btn" id="btn-pause">Freeze</button>
                <button class="btn active" id="btn-auto">Flow</button>
                <button class="btn" id="btn-manual">Step</button>
            </div>
            <div class="step-controls" id="step-controls" style="display: none;">
                <button class="step-btn" id="btn-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                <button class="step-btn" id="btn-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
                <button class="step-btn primary" id="btn-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">Timing</div>
            <div class="slider-row">
                <div class="slider-label"><span>Speed</span><span id="speed-value">1.0×</span></div>
                <input type="range" class="slider" id="speed-slider" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="slider-row">
                <div class="slider-label"><span>Delay</span><span id="delay-value">3.0s</span></div>
                <input type="range" class="slider" id="delay-slider" min="1" max="10" step="0.5" value="3">
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">Camera</div>
            <div class="btn-group">
                <button class="btn active" id="btn-cam-manual">Static</button>
                <button class="btn" id="btn-cam-auto">Orbit</button>
            </div>
        </div>
    </div>

    <div class="status-panel">
        <div class="status-header">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-title" id="status-title">Flowing</span>
        </div>
        <div class="status-row"><span class="status-label">Current</span><span class="status-value highlight" id="current-agent">Input</span></div>
        <div class="status-row"><span class="status-label">Next</span><span class="status-value" id="next-agent">Core</span></div>
        <div class="status-row"><span class="status-label">Step</span><span class="status-value" id="current-step">1 / 7</span></div>
        <div class="progress-section">
            <div class="slider-label"><span>Progress</span><span id="progress-percent">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>
        </div>
    </div>

    <div class="flow-path">
        <div class="path-title">Crystal Path</div>
        <div class="path-nodes" id="path-nodes"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1520);
        scene.fog = new THREE.Fog(0x0a1520, 20, 60);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Ice-cold lighting
        const ambientLight = new THREE.AmbientLight(0x88aacc, 0.6);
        scene.add(ambientLight);

        const iceLight1 = new THREE.PointLight(0xc8e6ff, 1.5, 50);
        iceLight1.position.set(15, 15, 15);
        scene.add(iceLight1);

        const iceLight2 = new THREE.PointLight(0x88ccff, 1.2, 40);
        iceLight2.position.set(-15, 10, -10);
        scene.add(iceLight2);

        const iceLight3 = new THREE.PointLight(0xffffff, 0.8, 30);
        iceLight3.position.set(0, 20, 0);
        scene.add(iceLight3);

        const gridHelper = new THREE.GridHelper(40, 40, 0x4488cc, 0x1a2a3a);
        gridHelper.position.y = -5;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        const agents = [
            { id: 'input', name: 'Input', position: new THREE.Vector3(0, 4, 0), color: 0xffffff },
            { id: 'orchestrator', name: 'Core', position: new THREE.Vector3(0, 1.5, 0), color: 0xc8e6ff },
            { id: 'planner', name: 'Plan', position: new THREE.Vector3(5, 0, 3), color: 0x88ccff },
            { id: 'executor', name: 'Exec', position: new THREE.Vector3(4, -1, -4), color: 0x4488cc },
            { id: 'validator', name: 'Valid', position: new THREE.Vector3(-4, -1, -4), color: 0x66aadd },
            { id: 'memory', name: 'Store', position: new THREE.Vector3(-5, 0, 3), color: 0xaaddff },
            { id: 'output', name: 'Output', position: new THREE.Vector3(0, -3.5, 0), color: 0xffffff }
        ];

        const flowSequence = agents.map(a => a.id);
        const edges = [['input', 'orchestrator'], ['orchestrator', 'planner'], ['planner', 'executor'], ['executor', 'validator'], ['validator', 'memory'], ['memory', 'orchestrator'], ['orchestrator', 'output']];

        const pathNodes = document.getElementById('path-nodes');
        agents.forEach((agent, i) => {
            const node = document.createElement('div');
            node.className = 'path-node';
            node.id = `path-${i}`;
            node.innerHTML = `<div class="node-dot" style="background: #${agent.color.toString(16).padStart(6, '0')}"></div><span>${agent.name}</span>`;
            pathNodes.appendChild(node);
            if (i < agents.length - 1) {
                const arrow = document.createElement('span');
                arrow.className = 'path-arrow';
                arrow.id = `arrow-${i}`;
                arrow.textContent = '◇';
                pathNodes.appendChild(arrow);
            }
        });

        const agentMeshes = {};
        agents.forEach(agent => {
            // Diamond/crystal shape
            const geometry = new THREE.OctahedronGeometry(0.45, 0);
            const material = new THREE.MeshPhysicalMaterial({
                color: agent.color, metalness: 0.1, roughness: 0.05, transmission: 0.5, thickness: 0.5,
                emissive: agent.color, emissiveIntensity: 0.2, transparent: true, opacity: 0.9
            });
            const crystal = new THREE.Mesh(geometry, material);
            crystal.position.copy(agent.position);

            const wireGeometry = new THREE.OctahedronGeometry(0.55, 0);
            const wireMaterial = new THREE.MeshBasicMaterial({ color: agent.color, wireframe: true, transparent: true, opacity: 0.3 });
            const wire = new THREE.Mesh(wireGeometry, wireMaterial);
            wire.position.copy(agent.position);

            agentMeshes[agent.id] = { crystal, wire, material, wireMaterial, data: agent };
            scene.add(crystal);
            scene.add(wire);
        });

        const edgeMeshes = {};
        edges.forEach(([fromId, toId]) => {
            const from = agents.find(a => a.id === fromId);
            const to = agents.find(a => a.id === toId);
            const geometry = new THREE.BufferGeometry().setFromPoints([from.position, to.position]);
            const material = new THREE.LineBasicMaterial({ color: 0x2a3a4a, transparent: true, opacity: 0.4 });
            const line = new THREE.Line(geometry, material);
            edgeMeshes[`${fromId}-${toId}`] = { line, material, activated: false };
            scene.add(line);
        });

        const particleGeometry = new THREE.OctahedronGeometry(0.1, 0);
        const particleMaterial = new THREE.MeshBasicMaterial({ color: 0xc8e6ff });
        const flowParticle = new THREE.Mesh(particleGeometry, particleMaterial);
        flowParticle.visible = false;
        scene.add(flowParticle);

        let flowMode = 'auto', animationSpeed = 1, nodeDelay = 3, currentFlowIndex = 0, flowProgress = 0, isTransitioning = false, lastTime = 0;

        const btnPause = document.getElementById('btn-pause'), btnAuto = document.getElementById('btn-auto'), btnManual = document.getElementById('btn-manual');
        const stepControls = document.getElementById('step-controls'), btnReset = document.getElementById('btn-reset'), btnPrev = document.getElementById('btn-prev'), btnNext = document.getElementById('btn-next');
        const speedSlider = document.getElementById('speed-slider'), speedValue = document.getElementById('speed-value');
        const delaySlider = document.getElementById('delay-slider'), delayValue = document.getElementById('delay-value');
        const btnCamManual = document.getElementById('btn-cam-manual'), btnCamAuto = document.getElementById('btn-cam-auto');
        const statusDot = document.getElementById('status-dot'), statusTitle = document.getElementById('status-title');
        const currentAgentEl = document.getElementById('current-agent'), nextAgentEl = document.getElementById('next-agent'), currentStepEl = document.getElementById('current-step');
        const progressPercent = document.getElementById('progress-percent'), progressFill = document.getElementById('progress-fill');

        function setFlowMode(mode) {
            flowMode = mode;
            btnPause.classList.toggle('active', mode === 'paused');
            btnAuto.classList.toggle('active', mode === 'auto');
            btnManual.classList.toggle('active', mode === 'manual');
            stepControls.style.display = mode === 'manual' ? 'flex' : 'none';
            statusDot.classList.toggle('paused', mode === 'paused');
            statusTitle.textContent = mode === 'paused' ? 'Frozen' : mode === 'auto' ? 'Flowing' : 'Stepping';
        }

        btnPause.addEventListener('click', () => setFlowMode('paused'));
        btnAuto.addEventListener('click', () => setFlowMode('auto'));
        btnManual.addEventListener('click', () => setFlowMode('manual'));

        btnReset.addEventListener('click', () => {
            currentFlowIndex = 0; flowProgress = 0;
            Object.values(edgeMeshes).forEach(e => { e.activated = false; e.material.color.setHex(0x2a3a4a); e.material.opacity = 0.4; });
            updateUI();
        });

        btnPrev.addEventListener('click', () => { if (currentFlowIndex > 0) { currentFlowIndex--; flowProgress = 0; updateUI(); } });
        btnNext.addEventListener('click', () => { if (currentFlowIndex < agents.length - 1) { activateEdge(flowSequence[currentFlowIndex], flowSequence[currentFlowIndex + 1]); currentFlowIndex++; flowProgress = 0; updateUI(); } });

        speedSlider.addEventListener('input', (e) => { animationSpeed = parseFloat(e.target.value); speedValue.textContent = animationSpeed.toFixed(1) + '×'; });
        delaySlider.addEventListener('input', (e) => { nodeDelay = parseFloat(e.target.value); delayValue.textContent = nodeDelay.toFixed(1) + 's'; });
        btnCamManual.addEventListener('click', () => { controls.autoRotate = false; btnCamManual.classList.add('active'); btnCamAuto.classList.remove('active'); });
        btnCamAuto.addEventListener('click', () => { controls.autoRotate = true; controls.autoRotateSpeed = 0.8; btnCamAuto.classList.add('active'); btnCamManual.classList.remove('active'); });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); if (flowMode === 'manual') btnNext.click(); else setFlowMode(flowMode === 'paused' ? 'auto' : 'paused'); }
            else if (e.code === 'ArrowRight' && flowMode === 'manual') btnNext.click();
            else if (e.code === 'ArrowLeft' && flowMode === 'manual') btnPrev.click();
            else if (e.code === 'KeyR') btnReset.click();
        });

        function activateEdge(fromId, toId) { const key = `${fromId}-${toId}`; if (edgeMeshes[key]) edgeMeshes[key].activated = true; }

        function updateUI() {
            const currentAgent = agents[currentFlowIndex], nextAgent = agents[(currentFlowIndex + 1) % agents.length];
            currentAgentEl.textContent = currentAgent.name; nextAgentEl.textContent = nextAgent.name;
            currentStepEl.textContent = `${currentFlowIndex + 1} / ${agents.length}`;
            const progress = (currentFlowIndex / (agents.length - 1)) * 100;
            progressPercent.textContent = Math.round(progress) + '%'; progressFill.style.width = progress + '%';
            agents.forEach((_, i) => {
                const node = document.getElementById(`path-${i}`), arrow = document.getElementById(`arrow-${i}`);
                node.classList.remove('active', 'visited'); if (arrow) arrow.classList.remove('active');
                if (i < currentFlowIndex) { node.classList.add('visited'); if (arrow) arrow.classList.add('active'); }
                else if (i === currentFlowIndex) node.classList.add('active');
            });
            btnPrev.disabled = currentFlowIndex === 0; btnNext.disabled = currentFlowIndex >= agents.length - 1;
        }

        function highlightNode(nodeId, active) {
            const mesh = agentMeshes[nodeId];
            if (mesh) { mesh.material.emissiveIntensity = active ? 0.6 : 0.2; mesh.crystal.scale.setScalar(active ? 1.3 : 1); mesh.wire.scale.setScalar(active ? 1.4 : 1); mesh.wireMaterial.opacity = active ? 0.6 : 0.3; }
        }

        let time = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);
            const deltaTime = (currentTime - lastTime) / 1000; lastTime = currentTime; time += 0.008;

            Object.entries(edgeMeshes).forEach(([key, edge]) => { if (edge.activated) { edge.material.color.setHex(0x88ccff); edge.material.opacity = 0.6 + Math.sin(time * 2) * 0.2; } });

            if (flowMode === 'auto' && deltaTime < 0.1) {
                flowProgress += deltaTime * animationSpeed;
                const currentNodeId = flowSequence[currentFlowIndex], nextNodeId = flowSequence[(currentFlowIndex + 1) % flowSequence.length];
                agents.forEach(a => highlightNode(a.id, false)); highlightNode(currentNodeId, true);

                if (flowProgress < nodeDelay) { flowParticle.visible = false; isTransitioning = false; }
                else if (flowProgress < nodeDelay + 1) {
                    if (!isTransitioning) { isTransitioning = true; activateEdge(currentNodeId, nextNodeId); }
                    const t = flowProgress - nodeDelay;
                    flowParticle.position.lerpVectors(agents.find(a => a.id === currentNodeId).position, agents.find(a => a.id === nextNodeId).position, t);
                    flowParticle.visible = true; flowParticle.rotation.y += 0.1;
                } else { if (currentFlowIndex < agents.length - 1) { currentFlowIndex++; flowProgress = 0; updateUI(); } else flowProgress = nodeDelay; }
            } else { agents.forEach(a => highlightNode(a.id, false)); highlightNode(flowSequence[currentFlowIndex], true); flowParticle.visible = false; }

            Object.values(agentMeshes).forEach((mesh, i) => {
                mesh.crystal.rotation.y = time * 0.4 + i;
                mesh.wire.rotation.y = -time * 0.3 + i;
                mesh.crystal.position.y = mesh.data.position.y + Math.sin(time * 1.5 + i * 0.7) * 0.05;
                mesh.wire.position.y = mesh.crystal.position.y;
            });

            controls.update(); renderer.render(scene, camera);
        }

        updateUI(); animate(0);
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
