<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Code - MAS Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #000000;
            --bg-card: rgba(0, 20, 0, 0.9);
            --border-color: rgba(0, 255, 0, 0.3);
            --text-primary: #00ff00;
            --text-secondary: rgba(0, 255, 0, 0.6);
            --matrix-green: #00ff00;
            --matrix-dark: #003300;
            --matrix-bright: #66ff66;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        #canvas-container { width: 100vw; height: 100vh; }

        /* Matrix rain effect */
        .matrix-rain {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.1;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent);
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--matrix-green);
            text-decoration: none;
            font-size: 14px;
            text-shadow: 0 0 10px var(--matrix-green);
        }

        .title {
            font-size: 18px;
            color: var(--matrix-bright);
            text-shadow: 0 0 20px var(--matrix-green);
        }

        .control-panel {
            position: fixed;
            top: 80px;
            left: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 280px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.1);
        }

        .panel-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        .section-title {
            font-size: 12px;
            margin-bottom: 12px;
            color: var(--matrix-bright);
            text-shadow: 0 0 5px var(--matrix-green);
        }

        .btn-group { display: flex; gap: 6px; }

        .btn {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 11px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-transform: uppercase;
        }

        .btn:hover { background: rgba(0, 255, 0, 0.1); box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); }

        .btn.active {
            background: rgba(0, 255, 0, 0.2);
            border-color: var(--matrix-green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5), inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .slider-row { margin-top: 12px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
        .slider-label span:first-child { color: var(--text-secondary); }
        .slider-label span:last-child { color: var(--matrix-bright); text-shadow: 0 0 5px var(--matrix-green); }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            height: 2px;
            background: var(--matrix-dark);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--matrix-green);
            cursor: pointer;
            box-shadow: 0 0 10px var(--matrix-green);
        }

        .step-controls { display: flex; gap: 8px; margin-top: 12px; }

        .step-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--matrix-green);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-btn:hover:not(:disabled) { background: rgba(0, 255, 0, 0.1); box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); }
        .step-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .step-btn.primary { flex: 1; background: rgba(0, 255, 0, 0.15); }
        .step-btn svg { width: 18px; height: 18px; }

        .status-panel {
            position: fixed;
            top: 80px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 260px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.1);
        }

        .status-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--matrix-green);
            box-shadow: 0 0 15px var(--matrix-green);
            animation: blink 1s step-end infinite;
        }

        .status-dot.paused { animation: none; opacity: 0.5; }

        @keyframes blink { 50% { opacity: 0.3; } }

        .status-title { font-size: 13px; color: var(--matrix-bright); text-shadow: 0 0 5px var(--matrix-green); }
        .status-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 12px; border-bottom: 1px solid rgba(0, 255, 0, 0.1); }
        .status-row:last-of-type { border-bottom: none; }
        .status-label { color: var(--text-secondary); }
        .status-value { color: var(--matrix-bright); }

        .progress-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color); }
        .progress-bar { height: 4px; background: var(--matrix-dark); margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--matrix-green); box-shadow: 0 0 10px var(--matrix-green); transition: width 0.5s ease; }

        .flow-path {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
        }

        .path-title { font-size: 12px; color: var(--matrix-bright); margin-bottom: 12px; text-shadow: 0 0 5px var(--matrix-green); }
        .path-nodes { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .path-node {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid transparent;
            font-size: 11px;
            opacity: 0.3;
            transition: all 0.3s;
        }

        .path-node.visited { opacity: 1; color: var(--matrix-green); border-color: var(--matrix-dark); }
        .path-node.active { opacity: 1; color: var(--matrix-bright); border-color: var(--matrix-green); box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); text-shadow: 0 0 5px var(--matrix-green); }
        .path-arrow { color: var(--matrix-green); font-size: 14px; opacity: 0.2; }
        .path-arrow.active { opacity: 1; text-shadow: 0 0 5px var(--matrix-green); }
        .node-dot { width: 8px; height: 8px; background: currentColor; }
    </style>
</head>
<body>
    <canvas class="matrix-rain" id="matrix-rain"></canvas>
    <div id="canvas-container"></div>

    <div class="header">
        <a href="../index.html" class="back-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> [EXIT]</a>
        <div class="title">> MATRIX_SYSTEM_v3.0</div>
        <div></div>
    </div>

    <div class="control-panel">
        <div class="panel-section">
            <div class="section-title">> FLOW_CONTROL</div>
            <div class="btn-group">
                <button class="btn" id="btn-pause">[HALT]</button>
                <button class="btn active" id="btn-auto">[AUTO]</button>
                <button class="btn" id="btn-manual">[MAN]</button>
            </div>
            <div class="step-controls" id="step-controls" style="display: none;">
                <button class="step-btn" id="btn-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                <button class="step-btn" id="btn-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
                <button class="step-btn primary" id="btn-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">> TIMING</div>
            <div class="slider-row">
                <div class="slider-label"><span>SPEED</span><span id="speed-value">1.0x</span></div>
                <input type="range" class="slider" id="speed-slider" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="slider-row">
                <div class="slider-label"><span>DELAY</span><span id="delay-value">3.0s</span></div>
                <input type="range" class="slider" id="delay-slider" min="1" max="10" step="0.5" value="3">
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">> CAMERA</div>
            <div class="btn-group">
                <button class="btn active" id="btn-cam-manual">[FIXED]</button>
                <button class="btn" id="btn-cam-auto">[ORBIT]</button>
            </div>
        </div>
    </div>

    <div class="status-panel">
        <div class="status-header">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-title" id="status-title">> RUNNING</span>
        </div>
        <div class="status-row"><span class="status-label">NODE</span><span class="status-value" id="current-agent">INPUT</span></div>
        <div class="status-row"><span class="status-label">NEXT</span><span class="status-value" id="next-agent">CORE</span></div>
        <div class="status-row"><span class="status-label">STEP</span><span class="status-value" id="current-step">1/7</span></div>
        <div class="progress-section">
            <div class="slider-label"><span>PROGRESS</span><span id="progress-percent">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>
        </div>
    </div>

    <div class="flow-path">
        <div class="path-title">> EXECUTION_TRACE</div>
        <div class="path-nodes" id="path-nodes"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Matrix rain effect
        const rainCanvas = document.getElementById('matrix-rain');
        const rainCtx = rainCanvas.getContext('2d');
        rainCanvas.width = window.innerWidth;
        rainCanvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
        const fontSize = 14;
        const columns = rainCanvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawRain() {
            rainCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            rainCtx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
            rainCtx.fillStyle = '#00ff00';
            rainCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                rainCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > rainCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawRain, 50);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Green matrix lighting
        const ambientLight = new THREE.AmbientLight(0x003300, 0.8);
        scene.add(ambientLight);

        const greenLight = new THREE.PointLight(0x00ff00, 2, 50);
        greenLight.position.set(10, 15, 10);
        scene.add(greenLight);

        const greenLight2 = new THREE.PointLight(0x00ff00, 1.5, 40);
        greenLight2.position.set(-10, 10, -10);
        scene.add(greenLight2);

        const gridHelper = new THREE.GridHelper(40, 40, 0x00ff00, 0x003300);
        gridHelper.position.y = -5;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        const agents = [
            { id: 'input', name: 'INPUT', position: new THREE.Vector3(0, 4, 0), color: 0x00ff00 },
            { id: 'orchestrator', name: 'CORE', position: new THREE.Vector3(0, 1.5, 0), color: 0x00cc00 },
            { id: 'planner', name: 'PLAN', position: new THREE.Vector3(5, 0, 3), color: 0x00ff00 },
            { id: 'executor', name: 'EXEC', position: new THREE.Vector3(4, -1, -4), color: 0x00cc00 },
            { id: 'validator', name: 'VALID', position: new THREE.Vector3(-4, -1, -4), color: 0x00ff00 },
            { id: 'memory', name: 'MEM', position: new THREE.Vector3(-5, 0, 3), color: 0x00cc00 },
            { id: 'output', name: 'OUTPUT', position: new THREE.Vector3(0, -3.5, 0), color: 0x00ff00 }
        ];

        const flowSequence = agents.map(a => a.id);
        const edges = [['input', 'orchestrator'], ['orchestrator', 'planner'], ['planner', 'executor'], ['executor', 'validator'], ['validator', 'memory'], ['memory', 'orchestrator'], ['orchestrator', 'output']];

        const pathNodes = document.getElementById('path-nodes');
        agents.forEach((agent, i) => {
            const node = document.createElement('div');
            node.className = 'path-node';
            node.id = `path-${i}`;
            node.innerHTML = `<div class="node-dot"></div><span>${agent.name}</span>`;
            pathNodes.appendChild(node);
            if (i < agents.length - 1) {
                const arrow = document.createElement('span');
                arrow.className = 'path-arrow';
                arrow.id = `arrow-${i}`;
                arrow.textContent = '>>';
                pathNodes.appendChild(arrow);
            }
        });

        const agentMeshes = {};
        agents.forEach(agent => {
            const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const material = new THREE.MeshPhysicalMaterial({ color: agent.color, metalness: 0.5, roughness: 0.2, emissive: agent.color, emissiveIntensity: 0.3, transparent: true, opacity: 0.9 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.copy(agent.position);

            const wireGeometry = new THREE.BoxGeometry(1, 1, 1);
            const wireMaterial = new THREE.MeshBasicMaterial({ color: agent.color, wireframe: true, transparent: true, opacity: 0.5 });
            const wire = new THREE.Mesh(wireGeometry, wireMaterial);
            wire.position.copy(agent.position);

            agentMeshes[agent.id] = { cube, wire, material, wireMaterial, data: agent };
            scene.add(cube);
            scene.add(wire);
        });

        const edgeMeshes = {};
        edges.forEach(([fromId, toId]) => {
            const from = agents.find(a => a.id === fromId);
            const to = agents.find(a => a.id === toId);
            const geometry = new THREE.BufferGeometry().setFromPoints([from.position, to.position]);
            const material = new THREE.LineBasicMaterial({ color: 0x003300, transparent: true, opacity: 0.4 });
            const line = new THREE.Line(geometry, material);
            edgeMeshes[`${fromId}-${toId}`] = { line, material, activated: false };
            scene.add(line);
        });

        const particleGeometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const particleMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const flowParticle = new THREE.Mesh(particleGeometry, particleMaterial);
        flowParticle.visible = false;
        scene.add(flowParticle);

        let flowMode = 'auto', animationSpeed = 1, nodeDelay = 3, currentFlowIndex = 0, flowProgress = 0, isTransitioning = false, lastTime = 0;

        const btnPause = document.getElementById('btn-pause'), btnAuto = document.getElementById('btn-auto'), btnManual = document.getElementById('btn-manual');
        const stepControls = document.getElementById('step-controls'), btnReset = document.getElementById('btn-reset'), btnPrev = document.getElementById('btn-prev'), btnNext = document.getElementById('btn-next');
        const speedSlider = document.getElementById('speed-slider'), speedValue = document.getElementById('speed-value');
        const delaySlider = document.getElementById('delay-slider'), delayValue = document.getElementById('delay-value');
        const btnCamManual = document.getElementById('btn-cam-manual'), btnCamAuto = document.getElementById('btn-cam-auto');
        const statusDot = document.getElementById('status-dot'), statusTitle = document.getElementById('status-title');
        const currentAgentEl = document.getElementById('current-agent'), nextAgentEl = document.getElementById('next-agent'), currentStepEl = document.getElementById('current-step');
        const progressPercent = document.getElementById('progress-percent'), progressFill = document.getElementById('progress-fill');

        function setFlowMode(mode) {
            flowMode = mode;
            btnPause.classList.toggle('active', mode === 'paused');
            btnAuto.classList.toggle('active', mode === 'auto');
            btnManual.classList.toggle('active', mode === 'manual');
            stepControls.style.display = mode === 'manual' ? 'flex' : 'none';
            statusDot.classList.toggle('paused', mode === 'paused');
            statusTitle.textContent = mode === 'paused' ? '> HALTED' : mode === 'auto' ? '> RUNNING' : '> MANUAL';
        }

        btnPause.addEventListener('click', () => setFlowMode('paused'));
        btnAuto.addEventListener('click', () => setFlowMode('auto'));
        btnManual.addEventListener('click', () => setFlowMode('manual'));

        btnReset.addEventListener('click', () => {
            currentFlowIndex = 0; flowProgress = 0;
            Object.values(edgeMeshes).forEach(e => { e.activated = false; e.material.color.setHex(0x003300); e.material.opacity = 0.4; });
            updateUI();
        });

        btnPrev.addEventListener('click', () => { if (currentFlowIndex > 0) { currentFlowIndex--; flowProgress = 0; updateUI(); } });
        btnNext.addEventListener('click', () => { if (currentFlowIndex < agents.length - 1) { activateEdge(flowSequence[currentFlowIndex], flowSequence[currentFlowIndex + 1]); currentFlowIndex++; flowProgress = 0; updateUI(); } });

        speedSlider.addEventListener('input', (e) => { animationSpeed = parseFloat(e.target.value); speedValue.textContent = animationSpeed.toFixed(1) + 'x'; });
        delaySlider.addEventListener('input', (e) => { nodeDelay = parseFloat(e.target.value); delayValue.textContent = nodeDelay.toFixed(1) + 's'; });
        btnCamManual.addEventListener('click', () => { controls.autoRotate = false; btnCamManual.classList.add('active'); btnCamAuto.classList.remove('active'); });
        btnCamAuto.addEventListener('click', () => { controls.autoRotate = true; controls.autoRotateSpeed = 1; btnCamAuto.classList.add('active'); btnCamManual.classList.remove('active'); });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); if (flowMode === 'manual') btnNext.click(); else setFlowMode(flowMode === 'paused' ? 'auto' : 'paused'); }
            else if (e.code === 'ArrowRight' && flowMode === 'manual') btnNext.click();
            else if (e.code === 'ArrowLeft' && flowMode === 'manual') btnPrev.click();
            else if (e.code === 'KeyR') btnReset.click();
        });

        function activateEdge(fromId, toId) { const key = `${fromId}-${toId}`; if (edgeMeshes[key]) edgeMeshes[key].activated = true; }

        function updateUI() {
            const currentAgent = agents[currentFlowIndex], nextAgent = agents[(currentFlowIndex + 1) % agents.length];
            currentAgentEl.textContent = currentAgent.name; nextAgentEl.textContent = nextAgent.name;
            currentStepEl.textContent = `${currentFlowIndex + 1}/${agents.length}`;
            const progress = (currentFlowIndex / (agents.length - 1)) * 100;
            progressPercent.textContent = Math.round(progress) + '%'; progressFill.style.width = progress + '%';
            agents.forEach((_, i) => {
                const node = document.getElementById(`path-${i}`), arrow = document.getElementById(`arrow-${i}`);
                node.classList.remove('active', 'visited'); if (arrow) arrow.classList.remove('active');
                if (i < currentFlowIndex) { node.classList.add('visited'); if (arrow) arrow.classList.add('active'); }
                else if (i === currentFlowIndex) node.classList.add('active');
            });
            btnPrev.disabled = currentFlowIndex === 0; btnNext.disabled = currentFlowIndex >= agents.length - 1;
        }

        function highlightNode(nodeId, active) {
            const mesh = agentMeshes[nodeId];
            if (mesh) { mesh.material.emissiveIntensity = active ? 0.8 : 0.3; mesh.cube.scale.setScalar(active ? 1.2 : 1); mesh.wire.scale.setScalar(active ? 1.4 : 1); mesh.wireMaterial.opacity = active ? 0.8 : 0.5; }
        }

        let time = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);
            const deltaTime = (currentTime - lastTime) / 1000; lastTime = currentTime; time += 0.02;

            Object.entries(edgeMeshes).forEach(([key, edge]) => { if (edge.activated) { edge.material.color.setHex(0x00ff00); edge.material.opacity = 0.6 + Math.sin(time * 5) * 0.3; } });

            if (flowMode === 'auto' && deltaTime < 0.1) {
                flowProgress += deltaTime * animationSpeed;
                const currentNodeId = flowSequence[currentFlowIndex], nextNodeId = flowSequence[(currentFlowIndex + 1) % flowSequence.length];
                agents.forEach(a => highlightNode(a.id, false)); highlightNode(currentNodeId, true);

                if (flowProgress < nodeDelay) { flowParticle.visible = false; isTransitioning = false; }
                else if (flowProgress < nodeDelay + 1) {
                    if (!isTransitioning) { isTransitioning = true; activateEdge(currentNodeId, nextNodeId); }
                    const t = flowProgress - nodeDelay;
                    flowParticle.position.lerpVectors(agents.find(a => a.id === currentNodeId).position, agents.find(a => a.id === nextNodeId).position, t);
                    flowParticle.visible = true;
                    flowParticle.rotation.x += 0.1; flowParticle.rotation.y += 0.1;
                } else { if (currentFlowIndex < agents.length - 1) { currentFlowIndex++; flowProgress = 0; updateUI(); } else flowProgress = nodeDelay; }
            } else { agents.forEach(a => highlightNode(a.id, false)); highlightNode(flowSequence[currentFlowIndex], true); flowParticle.visible = false; }

            Object.values(agentMeshes).forEach((mesh, i) => {
                mesh.cube.rotation.y = time * 0.5 + i;
                mesh.wire.rotation.y = -time * 0.3 + i;
            });

            greenLight.intensity = 2 + Math.sin(time * 3) * 0.5;
            controls.update(); renderer.render(scene, camera);
        }

        updateUI(); animate(0);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
