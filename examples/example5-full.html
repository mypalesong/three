<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Featured Demo - MAS Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-cyan: #00d4ff;
            --accent-violet: #8b5cf6;
            --accent-magenta: #ec4899;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(10, 10, 15, 0.95), transparent);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Control Panel */
        .main-panel {
            position: fixed;
            top: 70px;
            left: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(20px);
            width: 280px;
        }

        .panel-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title.cyan { color: var(--accent-cyan); }
        .section-title.violet { color: var(--accent-violet); }
        .section-title.green { color: var(--accent-green); }
        .section-title.orange { color: var(--accent-orange); }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn.active {
            background: var(--accent-violet);
            border-color: var(--accent-violet);
        }

        .btn.active.green {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .btn.active.cyan {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .slider-row {
            margin-top: 12px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .slider-label span:first-child {
            color: var(--text-secondary);
        }

        .slider-label span:last-child {
            font-weight: 500;
        }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent-cyan);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider.violet::-webkit-slider-thumb {
            background: var(--accent-violet);
        }

        .slider.green::-webkit-slider-thumb {
            background: var(--accent-green);
        }

        /* Step Controls */
        .step-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .step-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
        }

        .step-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .step-btn.primary {
            flex: 1;
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .step-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Status Panel */
        .status-panel {
            position: fixed;
            top: 70px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(20px);
            width: 260px;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.paused {
            background: var(--accent-orange);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-title {
            font-size: 13px;
            font-weight: 500;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            color: var(--text-secondary);
        }

        .status-value {
            font-weight: 500;
        }

        .status-value.highlight {
            color: var(--accent-cyan);
        }

        /* Progress Bar */
        .progress-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .progress-bar {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
            transition: width 0.5s ease;
        }

        /* Agent List */
        .agent-list {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            backdrop-filter: blur(20px);
            display: flex;
            gap: 12px;
        }

        .agent-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.3s;
        }

        .agent-chip.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-cyan);
        }

        .agent-chip.completed {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--accent-green);
        }

        .chip-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Keyboard Shortcuts */
        .shortcuts {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            backdrop-filter: blur(20px);
            font-size: 11px;
            color: var(--text-secondary);
        }

        kbd {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: inherit;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="header">
        <a href="../index.html" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </a>
        <div class="title">◆ Full-Featured Demo</div>
        <div></div>
    </div>

    <div class="main-panel">
        <!-- Flow Mode -->
        <div class="panel-section">
            <div class="section-title cyan">
                <span>◉</span> Flow Mode
            </div>
            <div class="btn-group">
                <button class="btn" id="btn-pause">Pause</button>
                <button class="btn active" id="btn-auto">Auto</button>
                <button class="btn" id="btn-manual">Manual</button>
            </div>
            <div class="step-controls" id="step-controls" style="display: none;">
                <button class="step-btn" id="btn-reset">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
                <button class="step-btn" id="btn-prev">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <button class="step-btn primary" id="btn-next">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Timing -->
        <div class="panel-section">
            <div class="section-title violet">
                <span>◈</span> Timing
            </div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>Animation Speed</span>
                    <span id="speed-value">1.0x</span>
                </div>
                <input type="range" class="slider violet" id="speed-slider" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>Node Delay</span>
                    <span id="delay-value">3.0s</span>
                </div>
                <input type="range" class="slider" id="delay-slider" min="1" max="10" step="0.5" value="3">
            </div>
        </div>

        <!-- Camera -->
        <div class="panel-section">
            <div class="section-title green">
                <span>◎</span> Camera
            </div>
            <div class="btn-group">
                <button class="btn active green" id="btn-cam-manual">Manual</button>
                <button class="btn" id="btn-cam-auto">Auto Rotate</button>
            </div>
            <div class="slider-row" id="cam-speed-row" style="opacity: 0.4; pointer-events: none;">
                <div class="slider-label">
                    <span>Rotation Speed</span>
                    <span id="cam-speed-value">1.0x</span>
                </div>
                <input type="range" class="slider green" id="cam-speed-slider" min="0.1" max="10" step="0.1" value="1">
            </div>
        </div>

        <!-- View -->
        <div class="panel-section">
            <div class="section-title orange">
                <span>◇</span> View
            </div>
            <div class="slider-row">
                <div class="slider-label">
                    <span>Camera Distance</span>
                    <span id="distance-value">15</span>
                </div>
                <input type="range" class="slider" id="distance-slider" min="8" max="35" step="1" value="15">
            </div>
        </div>
    </div>

    <div class="status-panel">
        <div class="status-header">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-title" id="status-title">Flow Running</span>
        </div>

        <div class="status-row">
            <span class="status-label">Current Agent</span>
            <span class="status-value highlight" id="current-agent">Orchestrator</span>
        </div>
        <div class="status-row">
            <span class="status-label">Next Agent</span>
            <span class="status-value" id="next-agent">Planner</span>
        </div>
        <div class="status-row">
            <span class="status-label">Step</span>
            <span class="status-value" id="current-step">1 / 7</span>
        </div>
        <div class="status-row">
            <span class="status-label">Flow Mode</span>
            <span class="status-value" id="flow-mode">Auto</span>
        </div>

        <div class="progress-section">
            <div class="slider-label">
                <span>Progress</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="agent-list" id="agent-list">
        <!-- Generated by JS -->
    </div>

    <div class="shortcuts">
        <kbd>Space</kbd> Next · <kbd>←</kbd><kbd>→</kbd> Navigate · <kbd>R</kbd> Reset · <kbd>P</kbd> Pause
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 8;
        controls.maxDistance = 35;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00d4ff, 1.2, 60);
        pointLight1.position.set(15, 15, 15);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x8b5cf6, 1, 60);
        pointLight2.position.set(-15, -10, -15);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0xec4899, 0.6, 40);
        pointLight3.position.set(0, 20, 0);
        scene.add(pointLight3);

        // Grid
        const gridHelper = new THREE.GridHelper(30, 30, 0x1a1a2e, 0x1a1a2e);
        gridHelper.position.y = -4;
        scene.add(gridHelper);

        // Agent data
        const agents = [
            { id: 'input', name: 'Input', position: new THREE.Vector3(0, 3, 0), color: 0x00d4ff },
            { id: 'orchestrator', name: 'Orchestrator', position: new THREE.Vector3(0, 1, 0), color: 0x8b5cf6 },
            { id: 'planner', name: 'Planner', position: new THREE.Vector3(4, 0, 2), color: 0xec4899 },
            { id: 'executor', name: 'Executor', position: new THREE.Vector3(3, -1, -3), color: 0x10b981 },
            { id: 'validator', name: 'Validator', position: new THREE.Vector3(-3, -1, -3), color: 0xf59e0b },
            { id: 'memory', name: 'Memory', position: new THREE.Vector3(-4, 0, 2), color: 0x6366f1 },
            { id: 'output', name: 'Output', position: new THREE.Vector3(0, -3, 0), color: 0x14b8a6 }
        ];

        const flowSequence = agents.map(a => a.id);

        const edges = [
            ['input', 'orchestrator'],
            ['orchestrator', 'planner'],
            ['orchestrator', 'memory'],
            ['planner', 'executor'],
            ['executor', 'validator'],
            ['validator', 'orchestrator'],
            ['orchestrator', 'output']
        ];

        // Create agent chips UI
        const agentListEl = document.getElementById('agent-list');
        agents.forEach((agent, i) => {
            const chip = document.createElement('div');
            chip.className = 'agent-chip';
            chip.id = `chip-${i}`;
            chip.innerHTML = `
                <div class="chip-dot" style="background: #${agent.color.toString(16).padStart(6, '0')}"></div>
                <span>${agent.name}</span>
            `;
            agentListEl.appendChild(chip);
        });

        // Create agents
        const agentMeshes = {};
        agents.forEach(agent => {
            const geometry = new THREE.SphereGeometry(0.45, 32, 32);
            const material = new THREE.MeshPhysicalMaterial({
                color: agent.color,
                metalness: 0.15,
                roughness: 0.2,
                emissive: agent.color,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.75
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.copy(agent.position);

            const glowGeometry = new THREE.SphereGeometry(0.6, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: agent.color,
                transparent: true,
                opacity: 0.12
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.copy(agent.position);

            // Ring
            const ringGeometry = new THREE.RingGeometry(0.55, 0.62, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: agent.color,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.position.copy(agent.position);
            ring.rotation.x = Math.PI / 2;

            agentMeshes[agent.id] = {
                sphere, glow, ring, material, glowMaterial, ringMaterial,
                data: agent, baseEmissive: 0.2, baseOpacity: 0.75
            };
            scene.add(sphere);
            scene.add(glow);
            scene.add(ring);
        });

        // Create edges
        const edgeMeshes = {};
        edges.forEach(([fromId, toId]) => {
            const from = agents.find(a => a.id === fromId);
            const to = agents.find(a => a.id === toId);

            const points = [from.position, to.position];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x2a2a3e,
                transparent: true,
                opacity: 0.35
            });
            const line = new THREE.Line(geometry, material);
            edgeMeshes[`${fromId}-${toId}`] = { line, material };
            scene.add(line);
        });

        // Flow particle
        const particleGeometry = new THREE.SphereGeometry(0.12, 16, 16);
        const particleMaterial = new THREE.MeshBasicMaterial({
            color: 0x00d4ff,
            transparent: true,
            opacity: 0.95
        });
        const flowParticle = new THREE.Mesh(particleGeometry, particleMaterial);
        flowParticle.visible = false;
        scene.add(flowParticle);

        // State
        let flowMode = 'auto'; // 'paused', 'auto', 'manual'
        let animationSpeed = 1;
        let nodeDelay = 3;
        let cameraAutoRotate = false;
        let cameraRotateSpeed = 1;
        let currentFlowIndex = 0;
        let flowProgress = 0;
        let isTransitioning = false;
        let lastTime = 0;

        // UI Elements
        const btnPause = document.getElementById('btn-pause');
        const btnAuto = document.getElementById('btn-auto');
        const btnManual = document.getElementById('btn-manual');
        const stepControls = document.getElementById('step-controls');
        const btnReset = document.getElementById('btn-reset');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        const delaySlider = document.getElementById('delay-slider');
        const delayValue = document.getElementById('delay-value');
        const btnCamManual = document.getElementById('btn-cam-manual');
        const btnCamAuto = document.getElementById('btn-cam-auto');
        const camSpeedRow = document.getElementById('cam-speed-row');
        const camSpeedSlider = document.getElementById('cam-speed-slider');
        const camSpeedValue = document.getElementById('cam-speed-value');
        const distanceSlider = document.getElementById('distance-slider');
        const distanceValue = document.getElementById('distance-value');

        const statusDot = document.getElementById('status-dot');
        const statusTitle = document.getElementById('status-title');
        const currentAgentEl = document.getElementById('current-agent');
        const nextAgentEl = document.getElementById('next-agent');
        const currentStepEl = document.getElementById('current-step');
        const flowModeEl = document.getElementById('flow-mode');
        const progressPercent = document.getElementById('progress-percent');
        const progressFill = document.getElementById('progress-fill');

        // Flow mode handlers
        function setFlowMode(mode) {
            flowMode = mode;
            btnPause.classList.toggle('active', mode === 'paused');
            btnAuto.classList.toggle('active', mode === 'auto');
            btnManual.classList.toggle('active', mode === 'manual');
            stepControls.style.display = mode === 'manual' ? 'flex' : 'none';

            statusDot.classList.toggle('paused', mode === 'paused');
            statusTitle.textContent = mode === 'paused' ? 'Paused' : mode === 'auto' ? 'Flow Running' : 'Manual Mode';
            flowModeEl.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
        }

        btnPause.addEventListener('click', () => setFlowMode('paused'));
        btnAuto.addEventListener('click', () => setFlowMode('auto'));
        btnManual.addEventListener('click', () => setFlowMode('manual'));

        // Step controls
        btnReset.addEventListener('click', () => {
            currentFlowIndex = 0;
            flowProgress = 0;
            updateUI();
        });

        btnPrev.addEventListener('click', () => {
            if (currentFlowIndex > 0) {
                currentFlowIndex--;
                flowProgress = 0;
                updateUI();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentFlowIndex < agents.length - 1) {
                currentFlowIndex++;
                flowProgress = 0;
                updateUI();
            }
        });

        // Sliders
        speedSlider.addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
            speedValue.textContent = animationSpeed.toFixed(1) + 'x';
        });

        delaySlider.addEventListener('input', (e) => {
            nodeDelay = parseFloat(e.target.value);
            delayValue.textContent = nodeDelay.toFixed(1) + 's';
        });

        // Camera controls
        btnCamManual.addEventListener('click', () => {
            cameraAutoRotate = false;
            controls.autoRotate = false;
            btnCamManual.classList.add('active', 'green');
            btnCamAuto.classList.remove('active');
            camSpeedRow.style.opacity = '0.4';
            camSpeedRow.style.pointerEvents = 'none';
        });

        btnCamAuto.addEventListener('click', () => {
            cameraAutoRotate = true;
            controls.autoRotate = true;
            btnCamAuto.classList.add('active', 'green');
            btnCamManual.classList.remove('active', 'green');
            camSpeedRow.style.opacity = '1';
            camSpeedRow.style.pointerEvents = 'auto';
        });

        camSpeedSlider.addEventListener('input', (e) => {
            cameraRotateSpeed = parseFloat(e.target.value);
            controls.autoRotateSpeed = cameraRotateSpeed * 2;
            camSpeedValue.textContent = cameraRotateSpeed.toFixed(1) + 'x';
        });

        distanceSlider.addEventListener('input', (e) => {
            const distance = parseFloat(e.target.value);
            distanceValue.textContent = distance;
            const currentPos = camera.position.clone();
            const length = currentPos.length();
            camera.position.multiplyScalar(distance / length);
        });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (flowMode === 'manual') btnNext.click();
                else if (flowMode === 'paused') setFlowMode('auto');
                else setFlowMode('paused');
            } else if (e.code === 'ArrowRight' && flowMode === 'manual') {
                btnNext.click();
            } else if (e.code === 'ArrowLeft' && flowMode === 'manual') {
                btnPrev.click();
            } else if (e.code === 'KeyR') {
                btnReset.click();
            } else if (e.code === 'KeyP') {
                setFlowMode(flowMode === 'paused' ? 'auto' : 'paused');
            }
        });

        // Update UI
        function updateUI() {
            const currentAgent = agents[currentFlowIndex];
            const nextIndex = (currentFlowIndex + 1) % agents.length;
            const nextAgent = agents[nextIndex];

            currentAgentEl.textContent = currentAgent.name;
            nextAgentEl.textContent = nextAgent.name;
            currentStepEl.textContent = `${currentFlowIndex + 1} / ${agents.length}`;

            const progress = (currentFlowIndex / (agents.length - 1)) * 100;
            progressPercent.textContent = Math.round(progress) + '%';
            progressFill.style.width = progress + '%';

            // Update chips
            agents.forEach((_, i) => {
                const chip = document.getElementById(`chip-${i}`);
                chip.classList.remove('active', 'completed');
                if (i < currentFlowIndex) chip.classList.add('completed');
                else if (i === currentFlowIndex) chip.classList.add('active');
            });

            // Button states
            btnPrev.disabled = currentFlowIndex === 0;
            btnNext.disabled = currentFlowIndex >= agents.length - 1;
        }

        // Highlight functions
        function highlightNode(nodeId, active) {
            const mesh = agentMeshes[nodeId];
            if (mesh) {
                if (active) {
                    mesh.material.emissiveIntensity = 0.8;
                    mesh.material.opacity = 1;
                    mesh.glowMaterial.opacity = 0.35;
                    mesh.ringMaterial.opacity = 0.5;
                    mesh.sphere.scale.setScalar(1.25);
                    mesh.glow.scale.setScalar(1.4);
                } else {
                    mesh.material.emissiveIntensity = mesh.baseEmissive;
                    mesh.material.opacity = mesh.baseOpacity;
                    mesh.glowMaterial.opacity = 0.12;
                    mesh.ringMaterial.opacity = 0.2;
                    mesh.sphere.scale.setScalar(1);
                    mesh.glow.scale.setScalar(1);
                }
            }
        }

        function highlightEdge(fromId, toId, active) {
            const key = `${fromId}-${toId}`;
            const edge = edgeMeshes[key];
            if (edge) {
                if (active) {
                    edge.material.color.setHex(0x00d4ff);
                    edge.material.opacity = 0.9;
                } else {
                    edge.material.color.setHex(0x2a2a3e);
                    edge.material.opacity = 0.35;
                }
            }
        }

        // Animation
        let time = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);

            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            time += 0.01;

            // Flow logic
            if (flowMode === 'auto' && deltaTime < 0.1) {
                flowProgress += deltaTime * animationSpeed;

                const currentNodeId = flowSequence[currentFlowIndex];
                const nextIndex = (currentFlowIndex + 1) % flowSequence.length;
                const nextNodeId = flowSequence[nextIndex];

                // Reset all nodes first
                agents.forEach(a => highlightNode(a.id, false));
                edges.forEach(([f, t]) => highlightEdge(f, t, false));

                if (flowProgress < nodeDelay) {
                    highlightNode(currentNodeId, true);
                    flowParticle.visible = false;
                    isTransitioning = false;
                } else if (flowProgress < nodeDelay + 1) {
                    if (!isTransitioning) {
                        isTransitioning = true;
                        highlightEdge(currentNodeId, nextNodeId, true);
                    }

                    const t = (flowProgress - nodeDelay);
                    const from = agents.find(a => a.id === currentNodeId).position;
                    const to = agents.find(a => a.id === nextNodeId).position;

                    flowParticle.position.lerpVectors(from, to, t);
                    flowParticle.visible = true;

                    const targetAgent = agents.find(a => a.id === nextNodeId);
                    particleMaterial.color.setHex(targetAgent.color);

                    highlightNode(currentNodeId, true);
                } else {
                    currentFlowIndex = nextIndex;
                    flowProgress = 0;
                    updateUI();
                }
            } else if (flowMode === 'manual' || flowMode === 'paused') {
                agents.forEach(a => highlightNode(a.id, false));
                highlightNode(flowSequence[currentFlowIndex], true);
                flowParticle.visible = false;
            }

            // Ambient animations
            Object.values(agentMeshes).forEach((mesh, i) => {
                mesh.ring.rotation.z = time + i * 0.3;
                mesh.sphere.position.y = mesh.data.position.y + Math.sin(time * 1.5 + i * 0.6) * 0.06;
                mesh.glow.position.y = mesh.sphere.position.y;
                mesh.ring.position.y = mesh.sphere.position.y;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        updateUI();
        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
