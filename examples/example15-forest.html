<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Nature - MAS Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a1a10;
            --bg-card: rgba(20, 40, 25, 0.9);
            --border-color: rgba(100, 180, 100, 0.25);
            --text-primary: #e0f0e5;
            --text-secondary: rgba(224, 240, 229, 0.6);
            --forest-green: #4a8c4a;
            --forest-light: #7cb87c;
            --forest-dark: #2a5c2a;
            --earth-brown: #8b6b4a;
            --leaf-gold: #c9a84c;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: linear-gradient(180deg, #0a1a10 0%, #152015 100%);
            color: var(--text-primary);
            overflow: hidden;
        }

        #canvas-container { width: 100vw; height: 100vh; }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(10, 26, 16, 0.95), transparent);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--forest-light);
            text-decoration: none;
            font-size: 14px;
        }

        .title {
            font-family: 'Libre Baskerville', serif;
            font-size: 22px;
            font-weight: 400;
            color: var(--leaf-gold);
        }

        .control-panel {
            position: fixed;
            top: 80px;
            left: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(20px);
            width: 280px;
        }

        .panel-section {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        .section-title {
            font-family: 'Libre Baskerville', serif;
            font-size: 13px;
            margin-bottom: 14px;
            color: var(--forest-light);
        }

        .btn-group { display: flex; gap: 8px; }

        .btn {
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            background: rgba(100, 180, 100, 0.05);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Source Sans Pro', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn:hover { background: rgba(100, 180, 100, 0.15); }

        .btn.active {
            background: linear-gradient(135deg, rgba(74, 140, 74, 0.3), rgba(124, 184, 124, 0.3));
            border-color: var(--forest-green);
            box-shadow: 0 4px 20px rgba(100, 180, 100, 0.2);
        }

        .slider-row { margin-top: 14px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
        .slider-label span:first-child { color: var(--text-secondary); }
        .slider-label span:last-child { color: var(--leaf-gold); font-weight: 600; }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(100, 180, 100, 0.2);
            border-radius: 3px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, var(--forest-light), var(--leaf-gold));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(100, 180, 100, 0.4);
        }

        .step-controls { display: flex; gap: 10px; margin-top: 14px; }

        .step-btn {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border-color);
            background: rgba(100, 180, 100, 0.05);
            color: var(--forest-light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-btn:hover:not(:disabled) { background: rgba(100, 180, 100, 0.15); }
        .step-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .step-btn.primary { flex: 1; background: linear-gradient(135deg, rgba(74, 140, 74, 0.2), rgba(124, 184, 124, 0.2)); }
        .step-btn svg { width: 20px; height: 20px; }

        .status-panel {
            position: fixed;
            top: 80px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(20px);
            width: 260px;
        }

        .status-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--forest-light);
            box-shadow: 0 0 15px var(--forest-light);
            animation: breathe 4s ease-in-out infinite;
        }

        .status-dot.paused { animation: none; background: var(--leaf-gold); }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .status-title { font-family: 'Libre Baskerville', serif; font-size: 14px; color: var(--forest-light); }
        .status-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 13px; }
        .status-label { color: var(--text-secondary); }
        .status-value { font-weight: 600; }
        .status-value.highlight { color: var(--leaf-gold); }

        .progress-section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border-color); }
        .progress-bar { height: 8px; background: rgba(100, 180, 100, 0.15); border-radius: 4px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--forest-dark), var(--forest-green), var(--forest-light)); transition: width 0.5s ease; }

        .flow-path {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 24px;
            backdrop-filter: blur(20px);
        }

        .path-title { font-family: 'Libre Baskerville', serif; font-size: 13px; color: var(--forest-light); margin-bottom: 14px; }
        .path-nodes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .path-node {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(100, 180, 100, 0.05);
            border: 1px solid transparent;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .path-node.visited { opacity: 1; border-color: var(--forest-green); background: rgba(74, 140, 74, 0.15); }
        .path-node.active { opacity: 1; border-color: var(--leaf-gold); background: rgba(201, 168, 76, 0.1); box-shadow: 0 2px 15px rgba(201, 168, 76, 0.2); }
        .path-arrow { color: var(--forest-light); font-size: 16px; opacity: 0.3; }
        .path-arrow.active { opacity: 1; }
        .node-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="header">
        <a href="../index.html" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Return</a>
        <div class="title">🌿 Forest Nature</div>
        <div></div>
    </div>

    <div class="control-panel">
        <div class="panel-section">
            <div class="section-title">Flow Control</div>
            <div class="btn-group">
                <button class="btn" id="btn-pause">Rest</button>
                <button class="btn active" id="btn-auto">Flow</button>
                <button class="btn" id="btn-manual">Step</button>
            </div>
            <div class="step-controls" id="step-controls" style="display: none;">
                <button class="step-btn" id="btn-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                <button class="step-btn" id="btn-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
                <button class="step-btn primary" id="btn-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">Timing</div>
            <div class="slider-row">
                <div class="slider-label"><span>Speed</span><span id="speed-value">1.0×</span></div>
                <input type="range" class="slider" id="speed-slider" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="slider-row">
                <div class="slider-label"><span>Delay</span><span id="delay-value">3.0s</span></div>
                <input type="range" class="slider" id="delay-slider" min="1" max="10" step="0.5" value="3">
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">Camera</div>
            <div class="btn-group">
                <button class="btn active" id="btn-cam-manual">Still</button>
                <button class="btn" id="btn-cam-auto">Wander</button>
            </div>
        </div>
    </div>

    <div class="status-panel">
        <div class="status-header">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-title" id="status-title">Growing</span>
        </div>
        <div class="status-row"><span class="status-label">Current</span><span class="status-value highlight" id="current-agent">Seed</span></div>
        <div class="status-row"><span class="status-label">Next</span><span class="status-value" id="next-agent">Root</span></div>
        <div class="status-row"><span class="status-label">Step</span><span class="status-value" id="current-step">1 / 7</span></div>
        <div class="progress-section">
            <div class="slider-label"><span>Growth</span><span id="progress-percent">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>
        </div>
    </div>

    <div class="flow-path">
        <div class="path-title">Growth Path</div>
        <div class="path-nodes" id="path-nodes"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1a10);
        scene.fog = new THREE.Fog(0x0a1a10, 15, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Forest lighting - warm and dappled
        const ambientLight = new THREE.AmbientLight(0x445544, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffcc, 1);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        const greenLight = new THREE.PointLight(0x7cb87c, 1.2, 40);
        greenLight.position.set(-10, 10, -10);
        scene.add(greenLight);

        const goldLight = new THREE.PointLight(0xc9a84c, 0.8, 30);
        goldLight.position.set(10, 5, 10);
        scene.add(goldLight);

        const gridHelper = new THREE.GridHelper(40, 40, 0x4a8c4a, 0x1a2a1a);
        gridHelper.position.y = -5;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        const agents = [
            { id: 'input', name: 'Seed', position: new THREE.Vector3(0, 4, 0), color: 0xc9a84c },
            { id: 'orchestrator', name: 'Root', position: new THREE.Vector3(0, 1.5, 0), color: 0x8b6b4a },
            { id: 'planner', name: 'Trunk', position: new THREE.Vector3(5, 0, 3), color: 0x6b5b3a },
            { id: 'executor', name: 'Branch', position: new THREE.Vector3(4, -1, -4), color: 0x4a8c4a },
            { id: 'validator', name: 'Leaf', position: new THREE.Vector3(-4, -1, -4), color: 0x7cb87c },
            { id: 'memory', name: 'Flower', position: new THREE.Vector3(-5, 0, 3), color: 0xd4a5a5 },
            { id: 'output', name: 'Fruit', position: new THREE.Vector3(0, -3.5, 0), color: 0xcc6666 }
        ];

        const flowSequence = agents.map(a => a.id);
        const edges = [['input', 'orchestrator'], ['orchestrator', 'planner'], ['planner', 'executor'], ['executor', 'validator'], ['validator', 'memory'], ['memory', 'orchestrator'], ['orchestrator', 'output']];

        const pathNodes = document.getElementById('path-nodes');
        agents.forEach((agent, i) => {
            const node = document.createElement('div');
            node.className = 'path-node';
            node.id = `path-${i}`;
            node.innerHTML = `<div class="node-dot" style="background: #${agent.color.toString(16).padStart(6, '0')}"></div><span>${agent.name}</span>`;
            pathNodes.appendChild(node);
            if (i < agents.length - 1) {
                const arrow = document.createElement('span');
                arrow.className = 'path-arrow';
                arrow.id = `arrow-${i}`;
                arrow.textContent = '→';
                pathNodes.appendChild(arrow);
            }
        });

        const agentMeshes = {};
        agents.forEach(agent => {
            const geometry = new THREE.DodecahedronGeometry(0.45, 0);
            const material = new THREE.MeshPhysicalMaterial({ color: agent.color, metalness: 0.1, roughness: 0.6, emissive: agent.color, emissiveIntensity: 0.2, transparent: true, opacity: 0.95 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(agent.position);

            const glowGeometry = new THREE.DodecahedronGeometry(0.6, 0);
            const glowMaterial = new THREE.MeshBasicMaterial({ color: agent.color, transparent: true, opacity: 0.15 });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.copy(agent.position);

            agentMeshes[agent.id] = { mesh, glow, material, glowMaterial, data: agent };
            scene.add(mesh);
            scene.add(glow);
        });

        const edgeMeshes = {};
        edges.forEach(([fromId, toId]) => {
            const from = agents.find(a => a.id === fromId);
            const to = agents.find(a => a.id === toId);
            const geometry = new THREE.BufferGeometry().setFromPoints([from.position, to.position]);
            const material = new THREE.LineBasicMaterial({ color: 0x2a4a2a, transparent: true, opacity: 0.4 });
            const line = new THREE.Line(geometry, material);
            edgeMeshes[`${fromId}-${toId}`] = { line, material, activated: false };
            scene.add(line);
        });

        const particleGeometry = new THREE.DodecahedronGeometry(0.12, 0);
        const particleMaterial = new THREE.MeshBasicMaterial({ color: 0x7cb87c });
        const flowParticle = new THREE.Mesh(particleGeometry, particleMaterial);
        flowParticle.visible = false;
        scene.add(flowParticle);

        let flowMode = 'auto', animationSpeed = 1, nodeDelay = 3, currentFlowIndex = 0, flowProgress = 0, isTransitioning = false, lastTime = 0;

        const btnPause = document.getElementById('btn-pause'), btnAuto = document.getElementById('btn-auto'), btnManual = document.getElementById('btn-manual');
        const stepControls = document.getElementById('step-controls'), btnReset = document.getElementById('btn-reset'), btnPrev = document.getElementById('btn-prev'), btnNext = document.getElementById('btn-next');
        const speedSlider = document.getElementById('speed-slider'), speedValue = document.getElementById('speed-value');
        const delaySlider = document.getElementById('delay-slider'), delayValue = document.getElementById('delay-value');
        const btnCamManual = document.getElementById('btn-cam-manual'), btnCamAuto = document.getElementById('btn-cam-auto');
        const statusDot = document.getElementById('status-dot'), statusTitle = document.getElementById('status-title');
        const currentAgentEl = document.getElementById('current-agent'), nextAgentEl = document.getElementById('next-agent'), currentStepEl = document.getElementById('current-step');
        const progressPercent = document.getElementById('progress-percent'), progressFill = document.getElementById('progress-fill');

        function setFlowMode(mode) {
            flowMode = mode;
            btnPause.classList.toggle('active', mode === 'paused');
            btnAuto.classList.toggle('active', mode === 'auto');
            btnManual.classList.toggle('active', mode === 'manual');
            stepControls.style.display = mode === 'manual' ? 'flex' : 'none';
            statusDot.classList.toggle('paused', mode === 'paused');
            statusTitle.textContent = mode === 'paused' ? 'Resting' : mode === 'auto' ? 'Growing' : 'Stepping';
        }

        btnPause.addEventListener('click', () => setFlowMode('paused'));
        btnAuto.addEventListener('click', () => setFlowMode('auto'));
        btnManual.addEventListener('click', () => setFlowMode('manual'));

        btnReset.addEventListener('click', () => {
            currentFlowIndex = 0; flowProgress = 0;
            Object.values(edgeMeshes).forEach(e => { e.activated = false; e.material.color.setHex(0x2a4a2a); e.material.opacity = 0.4; });
            updateUI();
        });

        btnPrev.addEventListener('click', () => { if (currentFlowIndex > 0) { currentFlowIndex--; flowProgress = 0; updateUI(); } });
        btnNext.addEventListener('click', () => { if (currentFlowIndex < agents.length - 1) { activateEdge(flowSequence[currentFlowIndex], flowSequence[currentFlowIndex + 1]); currentFlowIndex++; flowProgress = 0; updateUI(); } });

        speedSlider.addEventListener('input', (e) => { animationSpeed = parseFloat(e.target.value); speedValue.textContent = animationSpeed.toFixed(1) + '×'; });
        delaySlider.addEventListener('input', (e) => { nodeDelay = parseFloat(e.target.value); delayValue.textContent = nodeDelay.toFixed(1) + 's'; });
        btnCamManual.addEventListener('click', () => { controls.autoRotate = false; btnCamManual.classList.add('active'); btnCamAuto.classList.remove('active'); });
        btnCamAuto.addEventListener('click', () => { controls.autoRotate = true; controls.autoRotateSpeed = 0.5; btnCamAuto.classList.add('active'); btnCamManual.classList.remove('active'); });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); if (flowMode === 'manual') btnNext.click(); else setFlowMode(flowMode === 'paused' ? 'auto' : 'paused'); }
            else if (e.code === 'ArrowRight' && flowMode === 'manual') btnNext.click();
            else if (e.code === 'ArrowLeft' && flowMode === 'manual') btnPrev.click();
            else if (e.code === 'KeyR') btnReset.click();
        });

        function activateEdge(fromId, toId) { const key = `${fromId}-${toId}`; if (edgeMeshes[key]) edgeMeshes[key].activated = true; }

        function updateUI() {
            const currentAgent = agents[currentFlowIndex], nextAgent = agents[(currentFlowIndex + 1) % agents.length];
            currentAgentEl.textContent = currentAgent.name; nextAgentEl.textContent = nextAgent.name;
            currentStepEl.textContent = `${currentFlowIndex + 1} / ${agents.length}`;
            const progress = (currentFlowIndex / (agents.length - 1)) * 100;
            progressPercent.textContent = Math.round(progress) + '%'; progressFill.style.width = progress + '%';
            agents.forEach((_, i) => {
                const node = document.getElementById(`path-${i}`), arrow = document.getElementById(`arrow-${i}`);
                node.classList.remove('active', 'visited'); if (arrow) arrow.classList.remove('active');
                if (i < currentFlowIndex) { node.classList.add('visited'); if (arrow) arrow.classList.add('active'); }
                else if (i === currentFlowIndex) node.classList.add('active');
            });
            btnPrev.disabled = currentFlowIndex === 0; btnNext.disabled = currentFlowIndex >= agents.length - 1;
        }

        function highlightNode(nodeId, active) {
            const mesh = agentMeshes[nodeId];
            if (mesh) { mesh.material.emissiveIntensity = active ? 0.5 : 0.2; mesh.mesh.scale.setScalar(active ? 1.3 : 1); mesh.glow.scale.setScalar(active ? 1.5 : 1); mesh.glowMaterial.opacity = active ? 0.35 : 0.15; }
        }

        let time = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);
            const deltaTime = (currentTime - lastTime) / 1000; lastTime = currentTime; time += 0.006;

            // Gentle swaying like wind in trees
            Object.entries(edgeMeshes).forEach(([key, edge]) => { if (edge.activated) { edge.material.color.setHex(0x7cb87c); edge.material.opacity = 0.6 + Math.sin(time * 1.5) * 0.15; } });

            if (flowMode === 'auto' && deltaTime < 0.1) {
                flowProgress += deltaTime * animationSpeed;
                const currentNodeId = flowSequence[currentFlowIndex], nextNodeId = flowSequence[(currentFlowIndex + 1) % flowSequence.length];
                agents.forEach(a => highlightNode(a.id, false)); highlightNode(currentNodeId, true);

                if (flowProgress < nodeDelay) { flowParticle.visible = false; isTransitioning = false; }
                else if (flowProgress < nodeDelay + 1) {
                    if (!isTransitioning) { isTransitioning = true; activateEdge(currentNodeId, nextNodeId); }
                    const t = flowProgress - nodeDelay;
                    flowParticle.position.lerpVectors(agents.find(a => a.id === currentNodeId).position, agents.find(a => a.id === nextNodeId).position, t);
                    flowParticle.visible = true; flowParticle.rotation.x += 0.05; flowParticle.rotation.y += 0.05;
                    particleMaterial.color.setHex(agents.find(a => a.id === nextNodeId).color);
                } else { if (currentFlowIndex < agents.length - 1) { currentFlowIndex++; flowProgress = 0; updateUI(); } else flowProgress = nodeDelay; }
            } else { agents.forEach(a => highlightNode(a.id, false)); highlightNode(flowSequence[currentFlowIndex], true); flowParticle.visible = false; }

            Object.values(agentMeshes).forEach((mesh, i) => {
                mesh.mesh.rotation.y = time * 0.2 + i;
                mesh.glow.rotation.y = -time * 0.15 + i;
                // Gentle breathing/swaying
                mesh.mesh.position.y = mesh.data.position.y + Math.sin(time * 1.2 + i * 0.8) * 0.08;
                mesh.mesh.position.x = mesh.data.position.x + Math.sin(time * 0.8 + i) * 0.03;
                mesh.glow.position.copy(mesh.mesh.position);
            });

            // Dappled light effect
            goldLight.intensity = 0.8 + Math.sin(time * 2) * 0.2;
            controls.update(); renderer.render(scene, camera);
        }

        updateUI(); animate(0);
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
